<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><link rel="manifest" href="/manifest.webmanifest"><title>AM STUDIO Reader</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 92px;background:radial-gradient(circle at top,#22151a 0,#07090d 38%)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:900;background:linear-gradient(145deg,#ff4b3e,#7c0d12)}h1{font-size:20px;margin:0}.muted{color:#9099a8;font-size:12px}.pill{border:1px solid #293141;border-radius:999px;padding:8px 11px;font-size:12px}.hero{border:1px solid #352329;border-radius:24px;padding:22px;background:linear-gradient(140deg,#23151a,#0d1118);margin-bottom:22px}.hero small{color:#ff736a;letter-spacing:.14em;text-transform:uppercase;font-weight:800}.hero h2{font-size:36px;line-height:.98;margin:9px 0 12px}.hero p{color:#bcc3cd;line-height:1.55}.btn{border:0;border-radius:13px;background:linear-gradient(135deg,#ff3b30,#b51d28);color:#fff;font-weight:800;padding:13px 16px}.section{display:flex;justify-content:space-between;align-items:end;margin:20px 0 12px}.section h3{margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #293141;background:#11151d;border-radius:18px;overflow:hidden}.cover{height:116px;padding:12px;display:flex;align-items:end;background:linear-gradient(145deg,#242c39,#0d1015);font-size:26px;font-weight:900}.meta{padding:12px}.meta b{display:block}.meta span{color:#9099a8;font-size:12px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#080b10f2;border-top:1px solid #293141;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:#929aa8;padding:8px}.nav .active{color:#fff;font-weight:800}@media(max-width:380px){.grid{grid-template-columns:1fr}.hero h2{font-size:31px}}</style></head><body><main class="shell"><div class="top"><div class="brand"><div class="logo">AM</div><div><h1>AM STUDIO</h1><div class="muted">Comics Reader • Alpha v0.1</div></div></div><div class="pill">FREE</div></div><section class="hero"><small>The official home of AM STUDIO comics</small><h2>Read. Collect.<br>Enter the Universe.</h2><p>Semua komik AM STUDIO dalam satu reader. Episode awal gratis, episode lanjutan dapat dibuka lewat AM STUDIO PASS.</p><button class="btn" id="explore">Explore Library</button></section><div class="section"><h3 id="title">Featured Universes</h3><span class="muted">6 series</span></div><div class="grid" id="grid"></div></main><nav class="nav"><button class="active" data-tab="home">⌂<br>Home</button><button data-tab="library">▦<br>Library</button><button data-tab="profile">●<br>Profile</button></nav><script>const series=[['AMU','Arda Moron Universe','Sci-Fi • Cyberpunk'],['LT','Legenda Ling Tian','Wuxia • Adventure'],['SG','Sun Gokong','Myth • Journey'],['HK','Han Kera','Wuxia • Legacy'],['HY','Han You','Wuxia • Mystery'],['LD','The Legendary Decks','Action • Mystery']];const grid=document.getElementById('grid'),title=document.getElementById('title');function draw(all=false){grid.innerHTML=(all?series:series.slice(0,4)).map(s=>`<article class="card"><div class="cover">${s[0]}</div><div class="meta"><b>${s[1]}</b><span>${s[2]} · Episode 1–10 FREE</span></div></article>`).join('');title.textContent=all?'All Universes':'Featured Universes'}draw();document.getElementById('explore').onclick=()=>draw(true);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.tab==='library')draw(true);if(b.dataset.tab==='home')draw(false);if(b.dataset.tab==='profile'){title.textContent='AM STUDIO PASS';grid.innerHTML='<article class="card" style="grid-column:1/-1"><div class="meta"><b>Premium access preview</b><span>Login, payment gateway, cloud progress, dan subscription akan masuk fase berikutnya.</span></div></article>'}});</script></body></html>
