<style>
:root{--bg:#05070b;--panel:#10151d;--line:#283142;--text:#fff;--muted:#98a2b3;--red:#ff3b30;--green:#66e3a4;--gold:#f1c56b;--blue:#8bb8ff}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100vh}.shell{max-width:700px;margin:auto;min-height:100vh;padding:16px 16px 112px;background:radial-gradient(circle at 50% -8%,#3a1721 0,#0b0f16 30%,#05070b 70%)}button,input{font:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{display:flex;gap:11px;align-items:center}.logo{width:50px;height:50px;border-radius:15px}.brand h1{margin:0;font-size:21px}.tiny{font-size:11px;color:var(--muted)}.pill,.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:#0b0f15;padding:7px 10px;font-size:10px;font-weight:800}.beta{color:#ff8a82;border-color:#5a2d32}.hero,.box,.universe{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#21151b,#0d1117);padding:20px;margin-bottom:15px}.hero h2{font-size:37px;line-height:1;margin:10px 0 12px}.hero p,.box p,.universe p{color:#c2c8d2;line-height:1.55}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#ff776f;font-weight:900}.btn{border:0;border-radius:14px;padding:12px 15px;background:linear-gradient(135deg,#ff3b30,#b71927);color:#fff;font-weight:900}.ghost{background:#151b25;border:1px solid var(--line)}.row{display:flex;gap:9px;flex-wrap:wrap}.section{display:flex;justify-content:space-between;align-items:end;margin:22px 0 11px}.section h3{margin:0;font-size:21px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--panel);cursor:pointer}.cover{height:145px;padding:13px;display:flex;align-items:flex-end;font-size:27px;font-weight:1000;position:relative;background:linear-gradient(145deg,#273246,#0d1118)}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#05070bda)}.cover span{position:relative;z-index:1}.c-amu{background:radial-gradient(circle at 70% 15%,#1f7aff66,transparent 28%),linear-gradient(145deg,#102a48,#0a0e15)}.c-lt,.c-hk,.c-hy{background:radial-gradient(circle at 70% 15%,#ffc85755,transparent 28%),linear-gradient(145deg,#4a2b13,#0d1118)}.c-sg-battle{background:radial-gradient(circle at 70% 15%,#ff643a66,transparent 28%),linear-gradient(145deg,#502017,#0d0d10)}.c-sg-journey{background:radial-gradient(circle at 70% 15%,#f3df9f55,transparent 28%),linear-gradient(145deg,#423317,#0e1011)}.c-royal-gambler{background:radial-gradient(circle at 70% 15%,#e6b45c55,transparent 28%),linear-gradient(145deg,#3b2818,#0c0d10)}.c-ld{background:radial-gradient(circle at 70% 15%,#a874ff55,transparent 28%),linear-gradient(145deg,#26194b,#0c0d12)}.c-13{background:radial-gradient(circle at 70% 15%,#ff1d1d55,transparent 28%),linear-gradient(145deg,#361015,#09090b)}.c-wr{background:radial-gradient(circle at 70% 15%,#ffd34d55,transparent 28%),linear-gradient(145deg,#413415,#0d1118)}.c-arda-family{background:radial-gradient(circle at 70% 15%,#ff9bd555,transparent 28%),linear-gradient(145deg,#3d2032,#0d1118)}.meta{padding:12px}.meta b{display:block}.meta small{display:block;color:var(--muted);margin-top:3px}.qc{color:var(--gold)}.ok{color:var(--green)}.dev{color:#ff8a82}.search,.back{width:100%;border:1px solid var(--line);background:#10151d;color:#fff;border-radius:14px;padding:12px}.back{width:auto;margin-bottom:12px}.episodes{display:grid;gap:9px}.ep{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#10151d;color:#fff;border-radius:15px;padding:12px}.num{width:42px;height:42px;border-radius:11px;background:#1a2230;display:grid;place-items:center;font-weight:900}.epinfo{flex:1}.epinfo b,.epinfo small{display:block}.epinfo small{color:var(--muted)}.notice{border:1px solid #4c3d23;background:#17140d;border-radius:15px;padding:13px;color:#dcc58f;line-height:1.45;font-size:12px}.reader-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:8px 0 12px}.comic-stack{display:grid;gap:0;background:#000;border-radius:17px;overflow:hidden;border:1px solid var(--line)}.comic-page{width:100%;display:block}.placeholder{min-height:55vh;border:1px solid var(--line);border-radius:20px;background:linear-gradient(150deg,#253242,#10151d 55%,#080b10);padding:24px;display:flex;flex-direction:column;justify-content:flex-end}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(700px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#070a0ff2;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.nav button{background:none;border:0;color:#8f99aa;padding:8px;font-size:11px}.nav .active{color:#fff;font-weight:900}@media(max-width:390px){.hero h2{font-size:32px}.cover{height:132px}.grid{gap:10px}}

/* AM STUDIO Comics — premium catalog finishing v3, 2026-10-30 */
:root{color-scheme:dark;--bg:#070a10;--panel:#10151e;--line:#2a3341;--muted:#a2aebe}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 50% 0,rgba(65,25,38,.16),transparent 52%),#070a10}
.shell{width:100%;max-width:1200px;margin:auto;padding:25px clamp(16px,3.5vw,44px) 144px;background:radial-gradient(ellipse at 50% -10%,rgba(62,27,40,.35),transparent 48%)}
.top{margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid #ffffff16}
.logo{width:44px;height:44px;border-radius:12px;box-shadow:0 3px 20px #0005}
.brand h1{font-size:20px;font-weight:850;letter-spacing:.065em}
.brand .tiny{margin-top:3px;font-size:11px;letter-spacing:.02em}
.top>.pill{font-size:10px;font-weight:800;letter-spacing:.08em;padding:9px 12px;border-color:#4c3640;background:#1b121b;color:#ffd1d1}
.hero{position:relative;isolation:isolate;overflow:hidden;padding:clamp(25px,4vw,42px);border:1px solid #50323b;border-radius:24px;background:radial-gradient(ellipse at 100% 10%,#6c253b66,transparent 56%),linear-gradient(118deg,#22151e 0%,#101721 68%,#0c121b 100%);box-shadow:0 16px 40px #0002}
.hero:after{content:"AM";position:absolute;z-index:-1;right:15px;bottom:-45px;font-size:clamp(90px,18vw,220px);line-height:1;font-weight:900;letter-spacing:-.12em;color:#ffffff06;pointer-events:none}
.hero h2{font-size:clamp(33px,4.25vw,55px);line-height:1.04;letter-spacing:-.055em;max-width:670px;margin:14px 0}
.hero p{max-width:560px;font-size:clamp(13px,1.45vw,15px);line-height:1.65;margin:0 0 22px}
.hero .row{gap:11px}
.btn{min-height:43px;padding:11px 18px;font-weight:800;border-radius:11px;cursor:pointer;transition:filter .18s ease,transform .18s ease}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible,.back:focus-visible,.nav button:focus-visible{outline:2px solid #f3b2b2;outline-offset:3px}
.ghost{background:#151d29;border:1px solid #364253}
.section{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:32px 0 16px}
.section h3{font-size:clamp(22px,2.2vw,27px);font-weight:800;letter-spacing:-.035em}
.section>.tiny{flex:none;color:#a5b1c0;border:1px solid #374151;border-radius:99px;padding:5px 9px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:stretch}
.card{min-width:0;display:flex;flex-direction:column;border:1px solid #283441;border-radius:17px;overflow:hidden;background:linear-gradient(160deg,#141c27,#10151e);cursor:pointer;box-shadow:0 8px 26px #0002;outline-offset:3px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:#607184;box-shadow:0 17px 36px #0005}
.card .cover{width:100%;height:auto;aspect-ratio:16/10;padding:12px;align-items:flex-start;justify-content:flex-start;background-size:cover;background-position:50% 44%;background-repeat:no-repeat;isolation:isolate;overflow:hidden}
.card .cover:after{background:linear-gradient(180deg,rgba(0,0,0,.22) 0%,transparent 30%,transparent 65%,rgba(2,6,13,.24) 100%);pointer-events:none}
.card .cover-code{display:inline-flex;align-self:flex-start;max-width:calc(100% - 4px);font-size:10px;font-weight:850;letter-spacing:.1em;line-height:1.1;color:#f9fafc;background:rgba(8,13,22,.65);border:1px solid #ffffff40;padding:7px 9px;border-radius:7px;backdrop-filter:blur(8px);box-shadow:0 3px 14px #0004;text-shadow:none}
.card .meta{flex:1;display:flex;flex-direction:column;gap:8px;padding:15px 16px 16px}
.card-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-heading h4{margin:0;font-size:17px;line-height:1.28;letter-spacing:-.03em;font-weight:800;overflow-wrap:anywhere}
.card-arrow{flex:none;color:#8c9bae;font-size:17px;line-height:1.1;transition:transform .18s ease,color .18s ease}
.card:hover .card-arrow{color:#e6edf7;transform:translate(2px,-2px)}
.favorite-mark{font-size:13px;color:#ff8e96}
.card .card-genre{margin:0;color:#a4b0c1;font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:space-between;margin-top:auto;padding-top:11px;border-top:1px solid #ffffff16}
.episode-stat{color:#c3ccd7;font-size:11px;font-weight:650}
.status-chip{display:inline-flex;align-items:center;justify-content:center;max-width:100%;font-size:9px;letter-spacing:.035em;font-weight:850;line-height:1.2;white-space:normal;text-align:center;padding:6px 9px;border-radius:7px;border:1px solid #5f4e31;background:#271f14;color:#efc77b}
.status-chip.ok{color:#8fe7b5;border-color:#305a46;background:#13281f}
.status-chip.dev{color:#ffb2a5;border-color:#623b38;background:#2c1b1b}
.search{width:100%;max-width:740px;border-radius:12px;background:#121a26;padding:13px 15px}
.search:focus{outline:2px solid #6e839d;outline-offset:1px}
.universe{border-radius:20px;padding:clamp(20px,3vw,33px);background:linear-gradient(125deg,#21151e,#101722)}
.universe h2{font-size:clamp(26px,3vw,39px);line-height:1.1;letter-spacing:-.04em;margin:12px 0}
.universe p{font-size:14px;max-width:740px}
.episodes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ep{min-width:0;cursor:pointer;transition:border-color .18s ease,background .18s ease}
.ep:hover{border-color:#59687a;background:#172030}
.epinfo{min-width:0}
.epinfo b{line-height:1.3}
.epinfo small{margin-top:5px;font-size:11px;line-height:1.4}
.back{cursor:pointer}
.nav{width:min(470px,calc(100% - 32px));z-index:30;bottom:16px;left:50%;transform:translateX(-50%);border:1px solid #3a4556;border-radius:16px;background:#0e141cee;box-shadow:0 15px 40px #0008;padding:7px 10px calc(7px + env(safe-area-inset-bottom))}
.nav button{min-height:45px;cursor:pointer;border-radius:9px}
.nav button:hover{background:#ffffff0b}
.nav .active{color:#fff}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:19px}}
@media(max-width:740px){.shell{padding:16px 15px 120px}.top{margin-bottom:17px;padding-bottom:14px}.hero{border-radius:19px;padding:24px}.hero h2{font-size:clamp(32px,7.2vw,47px)}.section{margin:25px 0 12px}.grid{gap:12px}.card .meta{padding:12px;gap:7px}.card-heading h4{font-size:15px}.episodes{grid-template-columns:1fr}.nav{width:100%;bottom:0;border-radius:15px 15px 0 0;border-bottom:0;border-left:0;border-right:0;box-shadow:0 -12px 32px #0006;padding-bottom:calc(7px + env(safe-area-inset-bottom))}}
@media(max-width:440px){.shell{padding:13px 12px 115px}.top>.pill{font-size:9px;padding:7px 9px}.brand h1{font-size:17px}.logo{width:39px;height:39px}.grid{gap:10px}.card{border-radius:13px}.card .cover{aspect-ratio:4/3;padding:7px}.card .cover-code{font-size:8px;padding:5px 6px;border-radius:5px}.card .meta{padding:10px;gap:6px}.card-heading h4{font-size:13px;line-height:1.27}.card-arrow{font-size:14px}.card .card-genre{font-size:10px;line-height:1.45}.card-footer{flex-direction:column;align-items:flex-start;gap:7px;padding-top:9px}.episode-stat{font-size:10px}.status-chip{font-size:8px;padding:5px 7px}.hero{padding:21px}.hero p{font-size:13px}.btn{min-height:40px;padding:10px 13px;font-size:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card,.card-arrow,.btn,.ep{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<main class="shell" id="app"><div class="box"><h2>AM STUDIO</h2><p>Memuat komik...</p></div></main>
<nav class="nav"><button class="active" data-tab="home">⌂<br>Home</button><button data-tab="library">▦<br>Library</button><button data-tab="collection">♡<br>Collection</button><button data-tab="profile">●<br>Profile</button></nav>
<script>
(()=>{
const A=document.getElementById('app');let C={studio:{},series:[]},R={episodes:[]},current=null;
const st={fav:JSON.parse(localStorage.getItem('am_fav')||'[]'),progress:JSON.parse(localStorage.getItem('am_progress')||'{}')};
const save=()=>{localStorage.setItem('am_fav',JSON.stringify(st.fav));localStorage.setItem('am_progress',JSON.stringify(st.progress))};
const setTab=t=>document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
const header=()=>`<div class="top"><div class="brand"><img class="logo" src="/icon.svg"><div><h1>AM STUDIO</h1><div class="tiny">Official Comics Reader</div></div></div><span class="pill">AM STUDIO</span></div>`;
const countLabel=s=>s.episodeCountVerified?`${s.episodes} published episode${s.episodes===1?'':'s'}`:`Episode count • QC audit`;
const statusClass=s=>s.status==='ONGOING'?'ok':s.status==='DEVELOPMENT'?'dev':'qc';
const displayStatus=s=>({COMING_SOON:'COMING SOON',ONGOING:'ONGOING',DEVELOPMENT:'IN DEVELOPMENT',FB_CANON_AUDIT_PENDING:'CANON REVIEW',MIGRATION_PENDING:'IN PREPARATION'}[s.status]||String(s.status||'IN PREPARATION').replaceAll('_',' '));
const shortCount=s=>s.episodeCountVerified?(Number(s.episodes)>0?`${Number(s.episodes)} episode${Number(s.episodes)===1?'':'s'}`:'Belum ada episode'):'Episode dalam QC';
const card=s=>`<article class="card" data-open="${s.id}" tabindex="0" role="button" aria-label="Buka ${s.title}">
  <div class="cover c-${s.id}" ${s.cover?.asset?`style="background-image:linear-gradient(180deg,rgba(5,7,11,.04),rgba(5,7,11,.40)),url(&quot;${encodeURI(s.cover.asset)}&quot;);background-size:cover;background-position:center"`:""}>
    <span class="cover-code">${s.code||'AM'}</span>
  </div>
  <div class="meta">
    <div class="card-heading"><h4>${s.title}${st.fav.includes(s.id)?' <span class="favorite-mark" aria-label="Favorit">♥</span>':''}</h4><span class="card-arrow" aria-hidden="true">↗</span></div>
    <p class="card-genre">${s.tag||s.genre||'AM STUDIO Comics'}</p>
    <div class="card-footer"><span class="episode-stat">${shortCount(s)}</span><span class="status-chip ${statusClass(s)}">${displayStatus(s)}</span></div>
  </div>
</article>`;

const bindCards=()=>document.querySelectorAll('[data-open]').forEach(x=>{x.onclick=()=>openSeries(x.dataset.open);x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSeries(x.dataset.open)}}});
const featuredSeries=()=>[...C.series].sort((a,b)=>Number(b.id==='wukong-rebooted')-Number(a.id==='wukong-rebooted'));

function home(){setTab('home');A.innerHTML=header()+`<section class="hero"><span class="eyebrow">Original Comic Universes</span><h2>Read. Collect.<br>Enter the Universe.</h2><p>Jelajahi berbagai dunia cerita AM STUDIO. Pilih komik favorit dan baca episode yang sudah resmi tersedia.</p><div class="row"><button class="btn" id="libraryBtn">Explore Library</button><button class="btn ghost" id="collectionBtn">My Collection</button></div></section><div class="section"><h3>Universes</h3><span class="tiny">${C.series.length} series</span></div><div class="grid">${featuredSeries().map(card).join('')}</div>`;libraryBtn.onclick=library;collectionBtn.onclick=collection;bindCards()}
function library(){setTab('library');A.innerHTML=header()+`<input class="search" id="q" placeholder="Cari universe, genre, karakter..."><div class="section"><h3>AM STUDIO Library</h3><span class="tiny">Original comics collection</span></div><div class="grid" id="g">${featuredSeries().map(card).join('')}</div>`;q.oninput=e=>{const v=e.target.value.toLowerCase();g.innerHTML=featuredSeries().filter(s=>(s.title+' '+s.tag+' '+s.desc).toLowerCase().includes(v)).map(card).join('');bindCards()};bindCards()}
window.openSeries=id=>{current=id;setTab('library');const s=C.series.find(x=>x.id===id);if(!s)return library();let eps='';if(s.episodeCountVerified){for(let n=1;n<=s.episodes;n++){const title=s.episodeTitles?.[n-1]||`Episode ${String(n).padStart(2,'0')}`;const asset=assetEntry(id,n);eps+=`<button class="ep" data-ep="${n}"><span class="num">${n}</span><span class="epinfo"><b>${title}</b><small>${asset?'CANON FINAL • QC PASS':'Published metadata • asset audit'}</small></span><span>›</span></button>`}}else if(s.verifiedEpisodes?.length){eps=s.verifiedEpisodes.map(n=>`<button class="ep" data-ep="${n}"><span class="num">${n}</span><span class="epinfo"><b>Recovered continuity evidence</b><small>Episode ${String(n).padStart(2,'0')} • belum dinyatakan published</small></span><span>›</span></button>`).join('')}else{eps=`<div class="notice">Episode belum tersedia. Nantikan kelanjutannya.</div>`}A.innerHTML=`<button class="back" id="back">‹ Library</button><section class="universe"><span class="eyebrow">${s.tag}</span><h2>${s.title}</h2><p>${s.desc}</p><div class="row"><span class="badge ${statusClass(s)}">${s.status}</span><span class="pill">${countLabel(s)}</span><button class="btn ghost" id="fav">${st.fav.includes(id)?'♥ In Collection':'♡ Add to Collection'}</button></div></section>${!s.episodeCountVerified?`<div class="notice">STUDIO QC: angka episode lama tidak diperlakukan sebagai jumlah published sampai audit canon selesai.</div>`:''}<div class="section"><h3>Episodes</h3><span class="tiny">Reader gate active</span></div><div class="episodes">${eps}</div>`;back.onclick=library;fav.onclick=()=>toggleFav(id);document.querySelectorAll('[data-ep]').forEach(e=>e.onclick=()=>read(+e.dataset.ep))};
const assetEntry=(id,n)=>R.episodes?.find(x=>x.seriesId===id&&Number(x.episode)===Number(n)&&x.canonState==='CANON_FINAL'&&x.qc==='QC_PASS'&&Array.isArray(x.pages)&&x.pages.length);
window.read=n=>{const s=C.series.find(x=>x.id===current);if(!s)return library();const a=assetEntry(current,n);if(s.episodeCountVerified)st.progress[current]=Math.max(st.progress[current]||0,n);save();const title=s.episodeTitles?.[n-1]||`Episode ${String(n).padStart(2,'0')}`;const body=a?`<div class="reader-head"><div><span class="eyebrow">CANON FINAL • QC PASS</span><h2>${title}</h2></div><span class="pill">${a.pages.length} PAGE${a.pages.length>1?'S':''}</span></div><div class="comic-stack">${a.pages.map((p,i)=>`<img class="comic-page" loading="${i?'lazy':'eager'}" src="${p}" alt="${s.title} Episode ${n} Page ${i+1}">`).join('')}</div>`:`<div class="placeholder"><span class="eyebrow">Recovery Vault</span><h2>${title}</h2><p>${s.episodeCountVerified?'Metadata episode sudah terverifikasi, tetapi aset CANON FINAL belum tersedia di reader.':'File ini baru berupa continuity evidence. Belum boleh dianggap episode published sampai canon dan visual Bible lolos QC.'}</p><div class="notice">Tidak ada draft, revisi lama, atau visual yang gagal Bible yang akan ditampilkan sebagai final.</div></div>`;A.innerHTML=`<button class="back" id="backEp">‹ Episodes</button>${body}`;backEp.onclick=()=>openSeries(current)};
function toggleFav(id){st.fav=st.fav.includes(id)?st.fav.filter(x=>x!==id):[...st.fav,id];save();openSeries(id)}
function collection(){setTab('collection');const x=C.series.filter(s=>st.fav.includes(s.id));A.innerHTML=header()+`<div class="section"><h3>My Collection</h3><span class="tiny">${x.length} saved</span></div>${x.length?`<div class="grid">${x.map(card).join('')}</div>`:`<div class="box"><b>Belum ada koleksi.</b><p>Simpan universe favorit dari Library.</p></div>`}`;bindCards()}
function profile(){setTab('profile');const ready=R.episodes?.length||0;A.innerHTML=header()+`<div class="box"><span class="eyebrow">Status Koleksi</span><h2>Koleksi AM STUDIO</h2><p>${C.studio.publicPromotion===false?'Koleksi sedang diperbarui.':'Koleksi tersedia untuk dibaca.'}</p><div class="row"><span class="pill">${C.series.filter(s=>s.episodeCountVerified).length} verified series count</span><span class="pill">${ready} reader asset set</span></div></div><div class="box"><b>Informasi</b><p>Episode yang tersedia dapat dibaca langsung di aplikasi.</p></div>`}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>b.dataset.tab==='home'?home():b.dataset.tab==='library'?library():b.dataset.tab==='collection'?collection():profile());
async function j(u,f){try{const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():f}catch{return f}}
