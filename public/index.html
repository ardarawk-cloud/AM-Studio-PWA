<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<title>AM STUDIO — Private Beta</title>
<style>
:root{--bg:#05070b;--panel:#10151d;--line:#283142;--text:#fff;--muted:#98a2b3;--red:#ff3b30;--green:#66e3a4;--gold:#f1c56b;--blue:#8bb8ff}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100vh}.shell{max-width:700px;margin:auto;min-height:100vh;padding:16px 16px 112px;background:radial-gradient(circle at 50% -8%,#3a1721 0,#0b0f16 30%,#05070b 70%)}button,input{font:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{display:flex;gap:11px;align-items:center}.logo{width:50px;height:50px;border-radius:15px}.brand h1{margin:0;font-size:21px}.tiny{font-size:11px;color:var(--muted)}.pill,.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:#0b0f15;padding:7px 10px;font-size:10px;font-weight:800}.beta{color:#ff8a82;border-color:#5a2d32}.hero,.box,.universe{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#21151b,#0d1117);padding:20px;margin-bottom:15px}.hero h2{font-size:37px;line-height:1;margin:10px 0 12px}.hero p,.box p,.universe p{color:#c2c8d2;line-height:1.55}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#ff776f;font-weight:900}.btn{border:0;border-radius:14px;padding:12px 15px;background:linear-gradient(135deg,#ff3b30,#b71927);color:#fff;font-weight:900}.ghost{background:#151b25;border:1px solid var(--line)}.row{display:flex;gap:9px;flex-wrap:wrap}.section{display:flex;justify-content:space-between;align-items:end;margin:22px 0 11px}.section h3{margin:0;font-size:21px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--panel);cursor:pointer}.cover{height:145px;padding:13px;display:flex;align-items:flex-end;font-size:27px;font-weight:1000;position:relative;background:linear-gradient(145deg,#273246,#0d1118)}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#05070bda)}.cover span{position:relative;z-index:1}.c-amu{background:radial-gradient(circle at 70% 15%,#1f7aff66,transparent 28%),linear-gradient(145deg,#102a48,#0a0e15)}.c-lt,.c-hk,.c-hy{background:radial-gradient(circle at 70% 15%,#ffc85755,transparent 28%),linear-gradient(145deg,#4a2b13,#0d1118)}.c-sg-battle{background:radial-gradient(circle at 70% 15%,#ff643a66,transparent 28%),linear-gradient(145deg,#502017,#0d0d10)}.c-sg-journey{background:radial-gradient(circle at 70% 15%,#f3df9f55,transparent 28%),linear-gradient(145deg,#423317,#0e1011)}.c-royal-gambler{background:radial-gradient(circle at 70% 15%,#e6b45c55,transparent 28%),linear-gradient(145deg,#3b2818,#0c0d10)}.c-ld{background:radial-gradient(circle at 70% 15%,#a874ff55,transparent 28%),linear-gradient(145deg,#26194b,#0c0d12)}.c-13{background:radial-gradient(circle at 70% 15%,#ff1d1d55,transparent 28%),linear-gradient(145deg,#361015,#09090b)}.c-wr{background:radial-gradient(circle at 70% 15%,#ffd34d55,transparent 28%),linear-gradient(145deg,#413415,#0d1118)}.c-arda-family{background:radial-gradient(circle at 70% 15%,#ff9bd555,transparent 28%),linear-gradient(145deg,#3d2032,#0d1118)}.meta{padding:12px}.meta b{display:block}.meta small{display:block;color:var(--muted);margin-top:3px}.qc{color:var(--gold)}.ok{color:var(--green)}.dev{color:#ff8a82}.search,.back{width:100%;border:1px solid var(--line);background:#10151d;color:#fff;border-radius:14px;padding:12px}.back{width:auto;margin-bottom:12px}.episodes{display:grid;gap:9px}.ep{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#10151d;color:#fff;border-radius:15px;padding:12px}.num{width:42px;height:42px;border-radius:11px;background:#1a2230;display:grid;place-items:center;font-weight:900}.epinfo{flex:1}.epinfo b,.epinfo small{display:block}.epinfo small{color:var(--muted)}.notice{border:1px solid #4c3d23;background:#17140d;border-radius:15px;padding:13px;color:#dcc58f;line-height:1.45;font-size:12px}.reader-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:8px 0 12px}.comic-stack{display:grid;gap:0;background:#000;border-radius:17px;overflow:hidden;border:1px solid var(--line)}.comic-page{width:100%;display:block}.placeholder{min-height:55vh;border:1px solid var(--line);border-radius:20px;background:linear-gradient(150deg,#253242,#10151d 55%,#080b10);padding:24px;display:flex;flex-direction:column;justify-content:flex-end}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(700px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#070a0ff2;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.nav button{background:none;border:0;color:#8f99aa;padding:8px;font-size:11px}.nav .active{color:#fff;font-weight:900}@media(max-width:390px){.hero h2{font-size:32px}.cover{height:132px}.grid{gap:10px}}
</style>
</head>
<body>
<main class="shell" id="app"><div class="box"><h2>AM STUDIO</h2><p>Memuat private beta...</p></div></main>
<nav class="nav"><button class="active" data-tab="home">⌂<br>Home</button><button data-tab="library">▦<br>Library</button><button data-tab="collection">♡<br>Collection</button><button data-tab="profile">●<br>Profile</button></nav>
<script>
(()=>{
const A=document.getElementById('app');let C={studio:{},series:[]},R={episodes:[]},current=null;
const st={fav:JSON.parse(localStorage.getItem('am_fav')||'[]'),progress:JSON.parse(localStorage.getItem('am_progress')||'{}')};
const save=()=>{localStorage.setItem('am_fav',JSON.stringify(st.fav));localStorage.setItem('am_progress',JSON.stringify(st.progress))};
const setTab=t=>document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
const header=()=>`<div class="top"><div class="brand"><img class="logo" src="/icon.svg"><div><h1>AM STUDIO</h1><div class="tiny">Official Comics Reader</div></div></div><span class="pill beta">PRIVATE BETA</span></div>`;
const countLabel=s=>s.episodeCountVerified?`${s.episodes} published episode${s.episodes===1?'':'s'}`:`Episode count • QC audit`;
const statusClass=s=>s.status==='ONGOING'?'ok':s.status==='DEVELOPMENT'?'dev':'qc';
const card=s=>`<article class="card" data-open="${s.id}"><div class="cover c-${s.id}"><span>${s.code}</span></div><div class="meta"><b>${s.title}${st.fav.includes(s.id)?' ♡':''}</b><small>${s.tag}</small><small>${countLabel(s)}</small><span class="badge ${statusClass(s)}">${s.status}</span></div></article>`;
const bindCards=()=>document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openSeries(x.dataset.open));
function home(){setTab('home');A.innerHTML=header()+`<section class="hero"><span class="eyebrow">Studio QC environment</span><h2>Read. Collect.<br>Enter the Universe.</h2><p>Private beta AM STUDIO. Hanya data yang sudah terverifikasi yang ditampilkan sebagai published. Episode yang masih audit tidak akan dianggap final.</p><div class="row"><button class="btn" id="libraryBtn">Explore Library</button><button class="btn ghost" id="collectionBtn">My Collection</button></div></section><div class="section"><h3>Universes</h3><span class="tiny">${C.series.length} series</span></div><div class="grid">${C.series.map(card).join('')}</div>`;libraryBtn.onclick=library;collectionBtn.onclick=collection;bindCards()}
function library(){setTab('library');A.innerHTML=header()+`<input class="search" id="q" placeholder="Cari universe, genre, karakter..."><div class="section"><h3>AM STUDIO Library</h3><span class="tiny">Canon-safe catalog</span></div><div class="grid" id="g">${C.series.map(card).join('')}</div>`;q.oninput=e=>{const v=e.target.value.toLowerCase();g.innerHTML=C.series.filter(s=>(s.title+' '+s.tag+' '+s.desc).toLowerCase().includes(v)).map(card).join('');bindCards()};bindCards()}
window.openSeries=id=>{current=id;setTab('library');const s=C.series.find(x=>x.id===id);if(!s)return library();let eps='';if(s.episodeCountVerified){for(let n=1;n<=s.episodes;n++){const title=s.episodeTitles?.[n-1]||`Episode ${String(n).padStart(2,'0')}`;const asset=assetEntry(id,n);eps+=`<button class="ep" data-ep="${n}"><span class="num">${n}</span><span class="epinfo"><b>${title}</b><small>${asset?'CANON FINAL • QC PASS':'Published metadata • asset audit'}</small></span><span>›</span></button>`}}else if(s.verifiedEpisodes?.length){eps=s.verifiedEpisodes.map(n=>`<button class="ep" data-ep="${n}"><span class="num">${n}</span><span class="epinfo"><b>Recovered continuity evidence</b><small>Episode ${String(n).padStart(2,'0')} • belum dinyatakan published</small></span><span>›</span></button>`).join('')}else{eps=`<div class="notice">Belum ada episode yang dinyatakan published di Private Beta. Master Bible dan arsip sedang dicocokkan terlebih dahulu.</div>`}A.innerHTML=`<button class="back" id="back">‹ Library</button><section class="universe"><span class="eyebrow">${s.tag}</span><h2>${s.title}</h2><p>${s.desc}</p><div class="row"><span class="badge ${statusClass(s)}">${s.status}</span><span class="pill">${countLabel(s)}</span><button class="btn ghost" id="fav">${st.fav.includes(id)?'♥ In Collection':'♡ Add to Collection'}</button></div></section>${!s.episodeCountVerified?`<div class="notice">STUDIO QC: angka episode lama tidak diperlakukan sebagai jumlah published sampai audit canon selesai.</div>`:''}<div class="section"><h3>Episodes</h3><span class="tiny">Reader gate active</span></div><div class="episodes">${eps}</div>`;back.onclick=library;fav.onclick=()=>toggleFav(id);document.querySelectorAll('[data-ep]').forEach(e=>e.onclick=()=>read(+e.dataset.ep))};
const assetEntry=(id,n)=>R.episodes?.find(x=>x.seriesId===id&&Number(x.episode)===Number(n)&&x.canonState==='CANON_FINAL'&&x.qc==='QC_PASS'&&Array.isArray(x.pages)&&x.pages.length);
window.read=n=>{const s=C.series.find(x=>x.id===current);if(!s)return library();const a=assetEntry(current,n);if(s.episodeCountVerified)st.progress[current]=Math.max(st.progress[current]||0,n);save();const title=s.episodeTitles?.[n-1]||`Episode ${String(n).padStart(2,'0')}`;const body=a?`<div class="reader-head"><div><span class="eyebrow">CANON FINAL • QC PASS</span><h2>${title}</h2></div><span class="pill">${a.pages.length} PAGE${a.pages.length>1?'S':''}</span></div><div class="comic-stack">${a.pages.map((p,i)=>`<img class="comic-page" loading="${i?'lazy':'eager'}" src="${p}" alt="${s.title} Episode ${n} Page ${i+1}">`).join('')}</div>`:`<div class="placeholder"><span class="eyebrow">Recovery Vault</span><h2>${title}</h2><p>${s.episodeCountVerified?'Metadata episode sudah terverifikasi, tetapi aset CANON FINAL belum tersedia di reader.':'File ini baru berupa continuity evidence. Belum boleh dianggap episode published sampai canon dan visual Bible lolos QC.'}</p><div class="notice">Tidak ada draft, revisi lama, atau visual yang gagal Bible yang akan ditampilkan sebagai final.</div></div>`;A.innerHTML=`<button class="back" id="backEp">‹ Episodes</button>${body}`;backEp.onclick=()=>openSeries(current)};
function toggleFav(id){st.fav=st.fav.includes(id)?st.fav.filter(x=>x!==id):[...st.fav,id];save();openSeries(id)}
function collection(){setTab('collection');const x=C.series.filter(s=>st.fav.includes(s.id));A.innerHTML=header()+`<div class="section"><h3>My Collection</h3><span class="tiny">${x.length} saved</span></div>${x.length?`<div class="grid">${x.map(card).join('')}</div>`:`<div class="box"><b>Belum ada koleksi.</b><p>Simpan universe favorit dari Library.</p></div>`}`;bindCards()}
function profile(){setTab('profile');const ready=R.episodes?.length||0;A.innerHTML=header()+`<div class="box"><span class="eyebrow">Private Beta Status</span><h2>Studio QC Mode</h2><p>${C.studio.publicPromotion===false?'Public promotion OFF.':'Public promotion status belum dikunci.'}</p><div class="row"><span class="pill">${C.series.filter(s=>s.episodeCountVerified).length} verified series count</span><span class="pill">${ready} reader asset set</span></div></div><div class="box"><b>Release Policy</b><p>Reader hanya menerima CANON_FINAL + QC_PASS. Recovery evidence tidak otomatis menjadi published episode.</p></div>`}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>b.dataset.tab==='home'?home():b.dataset.tab==='library'?library():b.dataset.tab==='collection'?collection():profile());
async function j(u,f){try{const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():f}catch{return f}}
async function boot(){[C,R]=await Promise.all([j('/catalog.json',{studio:{},series:[]}),j('/reader-assets.json',{episodes:[]})]);home()}
boot();
})();
</script>
</body>
</html>
