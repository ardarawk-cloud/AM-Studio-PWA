<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070b"><link rel="manifest" href="/manifest.webmanifest"><title>AM STUDIO</title><style>:root{--bg:#05070b;--panel:#0f141c;--line:#2b3444;--text:#fff;--muted:#939cac;--red:#ff3b30;--gold:#e5b84d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:640px;margin:auto;min-height:100vh;padding:18px 16px 108px;background:radial-gradient(circle at 50% -10%,#31171d 0,#090c12 32%,#05070b 68%)}button,input{font:inherit}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:1000;font-size:20px;background:linear-gradient(145deg,#ff4b3e,#7f0d16);box-shadow:0 8px 30px #b6192750}.brand h1{font-size:21px;margin:0;letter-spacing:.02em}.muted{color:var(--muted);font-size:12px}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#0b0f15}.hero{position:relative;overflow:hidden;border:1px solid #43272e;border-radius:28px;padding:25px;background:linear-gradient(145deg,#29171e,#0b1017);margin-bottom:22px}.hero:after{content:'AM';position:absolute;right:-12px;bottom:-42px;font-size:135px;font-weight:1000;color:#ffffff08}.hero small,.eyebrow{color:#ff756d;letter-spacing:.14em;text-transform:uppercase;font-weight:900;font-size:11px}.hero h2{font-size:39px;line-height:.98;margin:10px 0 14px;position:relative}.hero p{color:#bec5d0;line-height:1.6;position:relative}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:14px;background:linear-gradient(135deg,#ff3b30,#b71927);color:#fff;font-weight:900;padding:13px 16px}.ghost{background:#151b25;border:1px solid var(--line)}.section{display:flex;justify-content:space-between;align-items:end;margin:22px 0 12px}.section h3{margin:0;font-size:21px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{border:1px solid var(--line);background:var(--panel);border-radius:21px;overflow:hidden;cursor:pointer;box-shadow:0 8px 25px #0003}.cover{height:164px;padding:14px;display:flex;align-items:flex-end;position:relative;font-size:29px;font-weight:1000}.cover:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,#05070bbf)}.cover strong{z-index:1}.c-amu{background:radial-gradient(circle at 70% 20%,#1877ff55,transparent 28%),linear-gradient(145deg,#102b46,#090e16 65%)}.c-lt{background:radial-gradient(circle at 70% 20%,#ffc85755,transparent 28%),linear-gradient(145deg,#4a2b13,#0c0d0f 65%)}.c-sg{background:radial-gradient(circle at 70% 20%,#ff643a66,transparent 28%),linear-gradient(145deg,#502017,#0d0d10 65%)}.c-ld{background:radial-gradient(circle at 70% 20%,#a874ff55,transparent 28%),linear-gradient(145deg,#26194b,#0c0d12 65%)}.c-13{background:radial-gradient(circle at 70% 20%,#ff1d1d55,transparent 28%),linear-gradient(145deg,#361015,#09090b 65%)}.c-wr{background:radial-gradient(circle at 70% 20%,#ffd34d55,transparent 28%),linear-gradient(145deg,#413415,#0c0d0f 65%)}.meta{padding:13px}.meta b{display:block}.meta span{color:var(--muted);font-size:12px}.progress{height:5px;border-radius:99px;background:#242c38;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ff3b30,#ff9388)}.box{border:1px solid var(--line);background:#10151d;border-radius:20px;padding:16px;margin-bottom:13px}.continue{display:flex;align-items:center;justify-content:space-between;gap:12px}.search{width:100%;padding:13px 14px;border:1px solid var(--line);background:#10151d;color:#fff;border-radius:14px;outline:none;margin-bottom:14px}.back{border:0;background:#151b25;color:#fff;border-radius:12px;padding:10px 13px;margin-bottom:15px}.universe{border:1px solid var(--line);border-radius:25px;padding:22px;background:linear-gradient(145deg,#1c2531,#0b0f15);margin-bottom:18px}.universe h2{font-size:31px;margin:6px 0}.statrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.stat{font-size:11px;border:1px solid var(--line);padding:7px 9px;border-radius:999px;color:#b8c0cd}.episodes{display:grid;gap:9px}.ep{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1px solid var(--line);background:#10151d;color:#fff;border-radius:16px;padding:13px}.num{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#1b2330;font-weight:900}.epinfo{flex:1}.epinfo b{display:block}.free{color:#65e6a6;font-size:11px}.locked{color:#ff8d87;font-size:11px}.reader{min-height:68vh}.page{border:1px solid var(--line);border-radius:23px;min-height:58vh;padding:26px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;background:linear-gradient(155deg,#253242,#10151d 55%,#080b10)}.page:after{content:'COMIC PAGE';position:absolute;right:-5px;top:22px;transform:rotate(90deg);transform-origin:right top;color:#ffffff0c;font-size:38px;font-weight:1000}.page h2{font-size:33px;margin:0 0 8px}.readerbar{display:flex;gap:10px;margin-top:12px}.readerbar button{flex:1}.pass{border:1px solid #52303a;border-radius:25px;padding:24px;background:linear-gradient(145deg,#2b171e,#10131a)}.price{font-size:34px;font-weight:1000;margin:8px 0}.feature{padding:8px 0;color:#c8ced7}.profile-card{border:1px solid var(--line);border-radius:22px;padding:19px;background:#10151d;margin-bottom:13px}.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}.toggle button{min-width:92px}.nav{position:fixed;z-index:9;left:50%;bottom:0;transform:translateX(-50%);width:min(640px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#070a0ff2;border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.nav button{background:none;border:0;color:#929baa;padding:8px}.nav .active{color:#fff;font-weight:900}@media(max-width:390px){.hero h2{font-size:33px}.cover{height:145px}}</style></head><body><main class="shell" id="app"></main><nav class="nav"><button class="active" data-tab="home">⌂<br>Home</button><button data-tab="library">▦<br>Library</button><button data-tab="profile">●<br>Profile</button></nav><script>const S=[{id:'amu',code:'AMU',title:'Arda Moron Universe',tag:'Sci-Fi • Cyberpunk',eps:24,desc:'Neo Avalon 2047. Seorang remaja pewaris teknologi tumbuh menjadi Ninja Cyber.'},{id:'lt',code:'LT',title:'Legenda Ling Tian',tag:'Wuxia • Adventure',eps:18,desc:'Warisan, perguruan dan perjalanan menuju puncak dunia persilatan.'},{id:'sg',code:'SG',title:'Sun Gokong',tag:'Myth • Journey',eps:20,desc:'Legenda klasik yang lahir kembali dalam petualangan sinematik AM STUDIO.'},{id:'ld',code:'LD',title:'The Legendary Decks',tag:'Action • Mystery',eps:12,desc:'Kartu, taruhan, rahasia dan konflik yang lebih besar dari permainan itu sendiri.'},{id:'13',code:'13',title:'13 Pintu Neraka',tag:'Horror • Mystery',eps:13,desc:'Tiga belas pintu, tiga belas kutukan, dan satu manusia yang seharusnya tidak membuka pintu pertama.'},{id:'wr',code:'WR',title:'Warung Republik',tag:'Comedy • Satire',eps:20,desc:'Satire kehidupan sehari-hari dari meja warung paling berisik di republik.'}];const A=document.getElementById('app');let current=null,deferredPrompt=null;const st={pass:localStorage.getItem('am_pass')==='1',progress:JSON.parse(localStorage.getItem('am_progress')||'{}'),bookmarks:JSON.parse(localStorage.getItem('am_bookmarks')||'[]')};function save(){localStorage.setItem('am_pass',st.pass?'1':'0');localStorage.setItem('am_progress',JSON.stringify(st.progress));localStorage.setItem('am_bookmarks',JSON.stringify(st.bookmarks))}function cls(id){return 'c-'+id}function header(){return `<div class="top"><div class="brand"><div class="logo">AM</div><div><h1>AM STUDIO</h1><div class="muted">Official Comics Reader • Beta</div></div></div><div class="pill">${st.pass?'★ PASS':'FREE'}</div></div>`}function card(s){let p=st.progress[s.id]||0;return `<article class="card" onclick="openU('${s.id}')"><div class="cover ${cls(s.id)}"><strong>${s.code}</strong></div><div class="meta"><b>${s.title}</b><span>${s.tag} · ${s.eps} episode</span>${p?`<div class="progress"><i style="width:${Math.min(100,p/s.eps*100)}%"></i></div>`:''}</div></article>`}function cards(arr=S){return arr.map(card).join('')}function setTab(tab){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab))}function home(){setTab('home');current=null;let entries=Object.entries(st.progress),cont='';if(entries.length){let [id,n]=entries.sort((a,b)=>b[1]-a[1])[0],s=S.find(x=>x.id===id);if(s)cont=`<div class="box continue"><div><b>Continue Reading</b><div class="muted">${s.title} • Episode ${String(n).padStart(2,'0')}</div></div><button class="btn" onclick="openU('${id}')">Continue</button></div>`}A.innerHTML=header()+`<section class="hero"><small>The official home of AM STUDIO comics</small><h2>Read. Collect.<br>Enter the Universe.</h2><p>Seluruh universe AM STUDIO dalam satu tempat. Episode awal gratis. Dunia yang lebih dalam terbuka lewat AM STUDIO PASS.</p><div class="row"><button class="btn" onclick="library()">Explore Library</button><button class="btn ghost" onclick="profile()">My Studio</button></div></section>${cont}<div class="section"><h3>Featured Universes</h3><span class="muted">${S.length} series</span></div><div class="grid">${cards()}</div>`}function library(){setTab('library');current=null;A.innerHTML=header()+`<input class="search" id="q" placeholder="Cari universe, genre, cerita..."><div class="section"><h3>AM STUDIO Library</h3><span class="muted">${S.length} universes</span></div><div class="grid" id="libraryGrid">${cards()}</div>`;document.getElementById('q').oninput=e=>{let q=e.target.value.toLowerCase();document.getElementById('libraryGrid').innerHTML=cards(S.filter(s=>(s.title+' '+s.tag+' '+s.desc).toLowerCase().includes(q)))}}window.openU=id=>{current=id;setTab('library');let s=S.find(x=>x.id===id),eps='';for(let n=1;n<=s.eps;n++){let lock=n>10&&!st.pass;eps+=`<button class="ep" onclick="${lock?'pass()':`read(${n})`}"><span class="num">${lock?'🔒':n}</span><span class="epinfo"><b>Episode ${String(n).padStart(2,'0')}</b><span class="${lock?'locked':'free'}">${lock?'AM STUDIO PASS':'READ NOW'}</span></span><span>›</span></button>`}A.innerHTML=`<button class="back" onclick="library()">‹ Library</button><section class="universe"><span class="eyebrow">${s.tag}</span><h2>${s.title}</h2><p class="muted">${s.desc}</p><div class="statrow"><span class="stat">${s.eps} EPISODES</span><span class="stat">1–10 FREE</span><span class="stat">SEASON 1</span></div></section><div class="episodes">${eps}</div>`}window.read=n=>{let s=S.find(x=>x.id===current);if(n>10&&!st.pass)return pass();st.progress[current]=Math.max(st.progress[current]||0,n);save();A.innerHTML=`<button class="back" onclick="openU('${current}')">‹ Episodes</button><section class="reader"><div class="page ${cls(current)}"><span class="eyebrow">${s.title}</span><h2>Episode ${String(n).padStart(2,'0')}</h2><p>Area pembacaan sudah siap menerima halaman komik resmi. Saat artwork recovered, gambar akan tampil vertikal di sini tanpa mengubah sistem reader.</p><div class="muted">Progress tersimpan otomatis di perangkat ini.</div></div><div class="readerbar"><button class="btn ghost" onclick="read(${Math.max(1,n-1)})">‹ Previous</button><button class="btn" onclick="${n<s.eps?`read(${n+1})`:`openU('${current}')`}">${n<s.eps?'Next ›':'Finish'}</button></div></section>`}window.pass=()=>{setTab('profile');A.innerHTML=header()+`<section class="pass"><span class="eyebrow">AM STUDIO MEMBERSHIP</span><h2>AM STUDIO PASS</h2><div class="price">COMING SOON</div><div class="feature">✓ Semua episode premium 11+</div><div class="feature">✓ Seluruh universe AM STUDIO</div><div class="feature">✓ Continue Reading & personal collection</div><div class="feature">✓ Member-only release & early access</div><p class="muted">Mode pembayaran real akan diaktifkan setelah katalog episode produksi siap.</p><div class="row"><button class="btn" onclick="togglePass()">${st.pass?'Disable Test Pass':'Preview Test Pass'}</button><button class="btn ghost" onclick="library()">Library</button></div></section>`}window.togglePass=()=>{st.pass=!st.pass;save();pass()}function profile(){setTab('profile');let read=Object.keys(st.progress).length,book=st.bookmarks.length;A.innerHTML=header()+`<div class="profile-card"><span class="eyebrow">MY STUDIO</span><h2 style="margin:7px 0">Reader Profile</h2><div class="muted">${read} universe sudah dibaca • ${book} koleksi tersimpan</div></div><div class="profile-card toggle"><div><b>AM STUDIO PASS</b><div class="muted">${st.pass?'Preview premium active':'Free reader'}</div></div><button class="btn" onclick="pass()">Manage</button></div><div class="profile-card"><b>Install AM STUDIO</b><p class="muted">Pasang PWA ke Home Screen agar terasa seperti aplikasi native.</p><button class="btn install" id="installBtn" onclick="installPWA()">Install / Add to Home</button></div>`}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});window.installPWA=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}else alert('Gunakan menu browser → Add to Home screen / Install app.')};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>b.dataset.tab==='home'?home():b.dataset.tab==='library'?library():profile());if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));home();</script></body></html>
