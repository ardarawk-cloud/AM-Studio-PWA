<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><link rel="manifest" href="/manifest.webmanifest"><title>AM STUDIO</title><style>*{box-sizing:border-box}body{margin:0;background:#05070b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:620px;margin:auto;min-height:100vh;padding:18px 16px 100px;background:radial-gradient(circle at top,#251319 0,#080b11 34%,#05070b 70%)}button{font:inherit}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.logo{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-weight:1000;background:linear-gradient(145deg,#ff493c,#850d16);box-shadow:0 8px 30px #b51d2840}.brand h1{font-size:21px;margin:0}.muted{color:#929baa;font-size:12px}.pill{border:1px solid #30394a;border-radius:999px;padding:8px 12px}.hero{border:1px solid #3a252c;border-radius:26px;padding:24px;background:linear-gradient(145deg,#25151b,#0d1118);margin-bottom:24px}.hero small{color:#ff746c;letter-spacing:.14em;text-transform:uppercase;font-weight:900}.hero h2{font-size:38px;line-height:1;margin:10px 0 14px}.hero p{color:#bec5cf;line-height:1.6}.btn{border:0;border-radius:14px;background:linear-gradient(135deg,#ff3b30,#b61927);color:#fff;font-weight:900;padding:14px 17px}.ghost{background:#151b25;border:1px solid #30394a}.section{display:flex;justify-content:space-between;align-items:end;margin:22px 0 12px}.section h3{margin:0;font-size:21px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{border:1px solid #293141;background:#10151d;border-radius:20px;overflow:hidden;cursor:pointer}.cover{height:150px;padding:14px;display:flex;align-items:end;background:linear-gradient(145deg,#283242,#0d1118);font-size:29px;font-weight:1000}.meta{padding:13px}.meta b{display:block}.meta span{color:#929baa;font-size:12px}.back{border:0;background:#151a23;color:#fff;border-radius:12px;padding:10px 13px;margin-bottom:16px}.universe{border:1px solid #30394a;border-radius:24px;padding:22px;background:linear-gradient(145deg,#1d2531,#0c1016);margin-bottom:18px}.universe h2{font-size:31px;margin:5px 0}.episodes{display:grid;gap:10px}.ep{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1px solid #293141;background:#10151d;color:#fff;border-radius:16px;padding:13px}.num{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#1c2430;font-weight:900}.epinfo{flex:1}.epinfo b{display:block}.free{color:#67e8a8;font-size:11px}.locked{color:#ff8d87;font-size:11px}.reader{min-height:68vh}.page{border:1px solid #30394a;border-radius:22px;min-height:58vh;padding:25px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(155deg,#2a3443,#11151d 55%,#090b10)}.page h2{font-size:32px;margin:0 0 8px}.readerbar{display:flex;justify-content:space-between;gap:10px;margin-top:12px}.readerbar button{flex:1}.pass{border:1px solid #4c2830;border-radius:24px;padding:24px;background:linear-gradient(145deg,#2b171d,#10131a)}.price{font-size:34px;font-weight:1000;margin:8px 0}.feature{padding:8px 0;color:#c8ced7}.nav{position:fixed;z-index:5;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#070a0ff2;border-top:1px solid #293141;padding:9px 12px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav button{background:none;border:0;color:#929baa;padding:8px}.nav .active{color:#fff;font-weight:900}@media(max-width:390px){.hero h2{font-size:33px}.cover{height:130px}}</style></head><body><main class="shell" id="app"></main><nav class="nav"><button class="active" data-tab="home">⌂<br>Home</button><button data-tab="library">▦<br>Library</button><button data-tab="profile">●<br>Profile</button></nav><script>const S=[['AMU','Arda Moron Universe','Sci-Fi • Cyberpunk'],['LT','Legenda Ling Tian','Wuxia • Adventure'],['SG','Sun Gokong','Myth • Journey'],['LD','The Legendary Decks','Action • Mystery'],['13','13 Pintu Neraka','Horror • Mystery'],['WR','Warung Republik','Comedy • Satire']];const A=document.getElementById('app');let current=null;const header=()=>`<div class="top"><div class="brand"><div class="logo">AM</div><div><h1>AM STUDIO</h1><div class="muted">Official Comics Reader • Beta</div></div></div><div class="pill">FREE</div></div>`;function cards(){return S.map((s,i)=>`<article class="card" onclick="openU(${i})"><div class="cover">${s[0]}</div><div class="meta"><b>${s[1]}</b><span>${s[2]} · Ep. 1–10 FREE</span></div></article>`).join('')}function home(){current=null;A.innerHTML=header()+`<section class="hero"><small>The official home of AM STUDIO comics</small><h2>Read. Collect.<br>Enter the Universe.</h2><p>Seluruh universe AM STUDIO dalam satu tempat. Baca episode awal gratis dan lanjutkan petualangan dengan AM STUDIO PASS.</p><button class="btn" onclick="library()">Explore Library</button></section><div class="section"><h3>Featured Universes</h3><span class="muted">${S.length} series</span></div><div class="grid">${cards()}</div>`}function library(){current=null;A.innerHTML=header()+`<div class="section"><h3>AM STUDIO Library</h3><span class="muted">${S.length} universes</span></div><div class="grid">${cards()}</div>`}window.openU=i=>{current=i;let s=S[i],eps='';for(let n=1;n<=15;n++){let lock=n>10;eps+=`<button class="ep" onclick="${lock?'pass()':`read(${n})`}"><span class="num">${lock?'🔒':n}</span><span class="epinfo"><b>Episode ${String(n).padStart(2,'0')}</b><span class="${lock?'locked':'free'}">${lock?'AM STUDIO PASS':'FREE • READ NOW'}</span></span><span>›</span></button>`}A.innerHTML=`<button class="back" onclick="library()">‹ Library</button><section class="universe"><span class="muted">${s[2]}</span><h2>${s[1]}</h2><p class="muted">Season 1 • Episode 1–10 dapat dibaca gratis.</p></section><div class="episodes">${eps}</div>`};window.read=n=>{let s=S[current];A.innerHTML=`<button class="back" onclick="openU(${current})">‹ Episodes</button><section class="reader"><div class="page"><span class="muted">${s[1]} • Episode ${n}</span><h2>Episode ${String(n).padStart(2,'0')}</h2><p>Comic page placeholder siap menerima poster/panel produksi resmi AM STUDIO.</p></div><div class="readerbar"><button class="btn ghost" onclick="read(${Math.max(1,n-1)})">‹ Previous</button><button class="btn" onclick="${n<10?`read(${n+1})`:'pass()'}">${n<10?'Next ›':'Continue 🔒'}</button></div></section>`};window.pass=()=>{A.innerHTML=header()+`<section class="pass"><small class="muted">AM STUDIO MEMBERSHIP</small><h2>AM STUDIO PASS</h2><div class="price">Coming Soon</div><div class="feature">✓ Episode premium 11+</div><div class="feature">✓ Semua universe AM STUDIO</div><div class="feature">✓ Reading progress & collection</div><div class="feature">✓ Member-only releases</div><p class="muted">Payment dan akun akan diaktifkan setelah katalog produksi siap.</p><button class="btn" onclick="library()">Back to Library</button></section>`};function profile(){pass()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');b.dataset.tab==='home'?home():b.dataset.tab==='library'?library():profile()});home();</script></body></html>
