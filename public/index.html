<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<title>AM STUDIO</title>
<style>
:root{--bg:#05070b;--panel:#10151d;--line:#2b3444;--text:#fff;--muted:#939cac;--red:#ff3b30;--green:#65e6a6;--gold:#f6c86f}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:680px;margin:auto;min-height:100vh;padding:18px 16px 112px;background:radial-gradient(circle at 50% -10%,#34161e 0,#090c12 31%,#05070b 70%)}button,input{font:inherit}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.logoimg{width:52px;height:52px;border-radius:16px}.brand h1{font-size:21px;margin:0}.muted{color:var(--muted);font-size:12px}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#0b0f15}.hero,.universe,.profile-card,.box{border:1px solid var(--line);border-radius:24px;padding:20px;background:linear-gradient(145deg,#21151b,#0d1117);margin-bottom:16px}.hero small,.eyebrow{color:#ff756d;letter-spacing:.14em;text-transform:uppercase;font-weight:900;font-size:11px}.hero h2{font-size:38px;line-height:1;margin:10px 0 14px}.hero p,.universe p{color:#bec5d0;line-height:1.6}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:14px;background:linear-gradient(135deg,#ff3b30,#b71927);color:#fff;font-weight:900;padding:13px 16px}.ghost{background:#151b25;border:1px solid var(--line)}.section{display:flex;justify-content:space-between;align-items:end;margin:22px 0 12px}.section h3{margin:0;font-size:21px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{border:1px solid var(--line);background:var(--panel);border-radius:21px;overflow:hidden;cursor:pointer}.cover{height:160px;padding:14px;display:flex;align-items:flex-end;font-size:27px;font-weight:1000;position:relative;background:linear-gradient(145deg,#273246,#0d1118)}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#05070bcc)}.cover span{position:relative;z-index:1}.c-amu{background:radial-gradient(circle at 70% 15%,#1f7aff66,transparent 26%),linear-gradient(145deg,#102a48,#0a0e15)}.c-lt,.c-hk,.c-hy{background:radial-gradient(circle at 70% 15%,#ffc85755,transparent 26%),linear-gradient(145deg,#4a2b13,#0d1118)}.c-sg-battle{background:radial-gradient(circle at 70% 15%,#ff643a66,transparent 26%),linear-gradient(145deg,#502017,#0d0d10)}.c-sg-journey{background:radial-gradient(circle at 70% 15%,#f3df9f55,transparent 26%),linear-gradient(145deg,#423317,#0e1011)}.c-royal-gambler{background:radial-gradient(circle at 70% 15%,#e6b45c55,transparent 26%),linear-gradient(145deg,#3b2818,#0c0d10)}.c-ld{background:radial-gradient(circle at 70% 15%,#a874ff55,transparent 26%),linear-gradient(145deg,#26194b,#0c0d12)}.c-13{background:radial-gradient(circle at 70% 15%,#ff1d1d55,transparent 26%),linear-gradient(145deg,#361015,#09090b)}.c-wr{background:radial-gradient(circle at 70% 15%,#ffd34d55,transparent 26%),linear-gradient(145deg,#413415,#0d1118)}.c-arda-family{background:radial-gradient(circle at 70% 15%,#ff9bd555,transparent 26%),linear-gradient(145deg,#3d2032,#0d1118)}.meta{padding:13px}.meta b{display:block}.meta span{color:var(--muted);font-size:12px}.badge{display:inline-flex;margin-top:7px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.ongoing,.published{color:var(--green)}.development,.asset-wait,.qc-wait{color:var(--gold)}.hold{color:#ff8d87}.search,.back{border:1px solid var(--line);background:#10151d;color:#fff;border-radius:14px;padding:12px}.search{width:100%;margin-bottom:14px}.episodes{display:grid;gap:9px}.ep{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1px solid var(--line);background:#10151d;color:#fff;border-radius:16px;padding:13px}.num{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#1b2330;font-weight:900}.epinfo{flex:1}.epinfo b,.epinfo small{display:block}.epinfo small{color:var(--muted)}.free{color:var(--green);font-size:11px}.locked{color:#ff8d87;font-size:11px}.asset-ready{color:#8fb9ff;font-size:10px;margin-top:3px}.reader-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:8px 0 14px}.comic-stack{display:grid;gap:0;background:#000;border-radius:18px;overflow:hidden;border:1px solid var(--line)}.comic-page{width:100%;height:auto;display:block;background:#0b0c0f}.placeholder{min-height:60vh;padding:26px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(155deg,#253242,#10151d 55%,#080b10);display:flex;flex-direction:column;justify-content:flex-end}.readerbar{display:flex;gap:10px;margin-top:12px}.readerbar button{flex:1}.notice{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#0d1219;margin:12px 0;color:#c6ced9;font-size:13px;line-height:1.5}.nav{position:fixed;z-index:9;left:50%;bottom:0;transform:translateX(-50%);width:min(680px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#070a0ff2;border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.nav button{background:none;border:0;color:#929baa;padding:8px;font-size:12px}.nav .active{color:#fff;font-weight:900}.error{margin:40px auto;max-width:420px;text-align:center}@media(max-width:390px){.hero h2{font-size:32px}.cover{height:145px}}
</style>
</head>
<body>
<main class="shell" id="app"><div class="error"><img src="/icon.svg" width="72" height="72" alt="AM STUDIO"><h2>AM STUDIO</h2><p class="muted">Memuat reader...</p></div></main>
<nav class="nav"><button class="active" data-tab="home">⌂<br>Home</button><button data-tab="library">▦<br>Library</button><button data-tab="collection">♡<br>Collection</button><button data-tab="profile">●<br>Profile</button></nav>
<script>
(()=>{
const FALLBACK={studio:{tagline:'Read. Collect. Enter the Universe.'},series:[]};
const A=document.getElementById('app');let C=FALLBACK,S=[],R={episodes:[]},Q={queue:[]},current=null;
const st={pass:localStorage.getItem('am_pass')==='1',progress:JSON.parse(localStorage.getItem('am_progress')||'{}'),fav:JSON.parse(localStorage.getItem('am_fav')||'[]')};
const save=()=>{localStorage.setItem('am_pass',st.pass?'1':'0');localStorage.setItem('am_progress',JSON.stringify(st.progress));localStorage.setItem('am_fav',JSON.stringify(st.fav))};
const setTab=t=>document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
const header=()=>`<div class="top"><div class="brand"><img class="logoimg" src="/icon.svg"><div><h1>AM STUDIO</h1><div class="muted">Official Comics Reader • Beta</div></div></div><div class="pill">${st.pass?'★ PASS':'FREE'}</div></div>`;
const queueState=id=>Q.queue?.find(x=>x.seriesId===id)?.state||'';
const assetEntry=(id,n)=>R.episodes?.find(x=>x.seriesId===id&&Number(x.episode)===Number(n)&&x.canonState==='CANON_FINAL'&&x.qc==='QC_PASS'&&Array.isArray(x.pages)&&x.pages.length);
const card=s=>`<article class="card" data-open="${s.id}"><div class="cover c-${s.id}"><span>${s.code}</span></div><div class="meta"><b>${s.title}${st.fav.includes(s.id)?' ♡':''}</b><span>${s.tag} · ${s.episodes} episode</span><div class="badge ${(s.status||'ONGOING').toLowerCase()}">${s.status||'ONGOING'}</div>${queueState(s.id)?`<div class="badge ${queueState(s.id).toLowerCase().replace('_','-')}">${queueState(s.id)}</div>`:''}</div></article>`;
const cards=a=>a.map(card).join('');
function bindCards(){document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openU(el.dataset.open))}
function home(){setTab('home');A.innerHTML=header()+`<section class="hero"><small>The official home of AM STUDIO comics</small><h2>Read. Collect.<br>Enter the Universe.</h2><p>${C.studio?.tagline||FALLBACK.studio.tagline}</p><div class="row"><button class="btn" id="goLibrary">Explore Library</button><button class="btn ghost" id="goCollection">My Collection</button></div></section><div class="section"><h3>Featured Universes</h3><span class="muted">${S.length} series</span></div><div class="grid">${cards(S)}</div>`;goLibrary.onclick=library;goCollection.onclick=collection;bindCards()}
function library(){setTab('library');A.innerHTML=header()+`<input class="search" id="q" placeholder="Cari universe, genre, cerita..."><div class="section"><h3>AM STUDIO Library</h3><span class="muted">${S.length} universes</span></div><div class="grid" id="g">${cards(S)}</div>`;q.oninput=e=>{const v=e.target.value.toLowerCase();g.innerHTML=cards(S.filter(s=>(s.title+' '+s.tag+' '+(s.desc||'')).toLowerCase().includes(v)));bindCards()};bindCards()}
window.openU=id=>{current=id;setTab('library');const s=S.find(x=>x.id===id);if(!s)return library();let eps='';for(let n=1;n<=s.episodes;n++){const locked=n>s.freeEpisodes&&!st.pass,ready=assetEntry(id,n),t=s.episodeTitles?.[n-1]||`Episode ${String(n).padStart(2,'0')}`;eps+=`<button class="ep" data-ep="${n}"><span class="num">${locked?'🔒':n}</span><span class="epinfo"><b>${t}</b><small>Episode ${String(n).padStart(2,'0')}</small><span class="${locked?'locked':'free'}">${locked?'AM STUDIO PASS':'READ NOW'}</span>${ready?'<span class="asset-ready">● CANON ASSET READY</span>':''}</span><span>›</span></button>`}A.innerHTML=`<button class="back" id="backLib">‹ Library</button><section class="universe"><span class="eyebrow">${s.tag}</span><h2>${s.title}</h2><p>${s.desc||''}</p><div class="row"><span class="badge ${(s.status||'ONGOING').toLowerCase()}">${s.status||'ONGOING'}</span>${queueState(id)?`<span class="badge">AUTO: ${queueState(id)}</span>`:''}<button class="btn ghost" id="favBtn">${st.fav.includes(id)?'♥ In Collection':'♡ Add to Collection'}</button></div></section><div class="episodes">${eps}</div>`;backLib.onclick=library;favBtn.onclick=()=>toggleFav(id);document.querySelectorAll('[data-ep]').forEach(el=>el.onclick=()=>{const n=+el.dataset.ep;n>s.freeEpisodes&&!st.pass?pass():read(n)})};
window.read=n=>{const s=S.find(x=>x.id===current);if(!s)return library();const a=assetEntry(current,n);st.progress[current]=Math.max(st.progress[current]||0,n);save();const t=s.episodeTitles?.[n-1]||`Episode ${String(n).padStart(2,'0')}`;let body;if(a){body=`<div class="reader-head"><div><span class="eyebrow">CANON FINAL • QC PASS</span><h2 style="margin:5px 0">${t}</h2></div><span class="pill">${a.pages.length} PAGE${a.pages.length>1?'S':''}</span></div><div class="comic-stack">${a.pages.map((p,i)=>`<img class="comic-page" loading="${i?'lazy':'eager'}" src="${p}" alt="${s.title} Episode ${n} Page ${i+1}">`).join('')}</div>`}else{body=`<div class="placeholder"><span class="eyebrow">${s.title}</span><h2>${t}</h2><p>Episode ini sudah terdaftar, tetapi asset CANON FINAL belum tersedia di storage publik.</p><div class="notice">Recovery Vault tetap menyimpan kandidat dan revisi. Reader tidak akan menampilkan file sebelum statusnya CANON_FINAL + QC_PASS.</div></div>`}A.innerHTML=`<button class="back" id="backEp">‹ Episodes</button>${body}<div class="readerbar"><button class="btn ghost" id="prev">‹ Previous</button><button class="btn" id="next">${n<s.episodes?'Next ›':'Finish'}</button></div>`;backEp.onclick=()=>openU(current);prev.onclick=()=>read(Math.max(1,n-1));next.onclick=()=>n<s.episodes?(n+1>s.freeEpisodes&&!st.pass?pass():read(n+1)):openU(current)};
window.toggleFav=id=>{st.fav=st.fav.includes(id)?st.fav.filter(x=>x!==id):[...st.fav,id];save();openU(id)};
function collection(){setTab('collection');const arr=S.filter(s=>st.fav.includes(s.id));A.innerHTML=header()+`<div class="section"><h3>My Collection</h3><span class="muted">${arr.length} saved</span></div>${arr.length?`<div class="grid">${cards(arr)}</div>`:`<div class="box"><b>Belum ada koleksi.</b><div class="muted">Tambahkan universe favorit dari Library.</div></div>`}`;bindCards()}
window.pass=()=>{setTab('profile');A.innerHTML=header()+`<section class="profile-card"><span class="eyebrow">AM STUDIO MEMBERSHIP</span><h2>AM STUDIO PASS</h2><p class="muted">Buka seluruh episode premium dan akses member.</p><div class="row"><button class="btn" id="togglePass">${st.pass?'Disable Test Pass':'Preview Test Pass'}</button><button class="btn ghost" id="backLibrary">Library</button></div></section>`;togglePass.onclick=()=>{st.pass=!st.pass;save();pass()};backLibrary.onclick=library};
function profile(){setTab('profile');const ready=R.episodes?.length||0;A.innerHTML=header()+`<div class="profile-card"><span class="eyebrow">MY STUDIO</span><h2>Reader Profile</h2><div class="muted">${Object.keys(st.progress).length} universe dibaca • ${st.fav.length} koleksi</div></div><div class="profile-card"><b>Recovery & Reader</b><p class="muted">${ready} episode memiliki asset CANON FINAL + QC PASS di registry.</p></div><div class="profile-card"><b>AM STUDIO PASS</b><p class="muted">${st.pass?'Test Pass aktif.':'Mode gratis aktif.'}</p><button class="btn" id="managePass">Manage Pass</button></div>`;managePass.onclick=pass}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>b.dataset.tab==='home'?home():b.dataset.tab==='library'?library():b.dataset.tab==='collection'?collection():profile());
async function json(url,fallback){try{const r=await fetch(url+'?ts='+Date.now(),{cache:'no-store'});return r.ok?await r.json():fallback}catch{return fallback}}
async function boot(){[C,R,Q]=await Promise.all([json('/catalog.json',FALLBACK),json('/reader-assets.json',{episodes:[]}),json('/release-queue.json',{queue:[]})]);S=C.series||[];home()}
boot();
})();
</script>
</body>
</html>
