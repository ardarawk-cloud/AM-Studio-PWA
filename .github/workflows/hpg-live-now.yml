name: HPG Live Now
on:
  push:
    branches: [diag/hpg-live-now]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect live state
        shell: bash
        run: |
          set -u
          BASE='https://am-studio-pwa.ardarawk.workers.dev'
          echo '--- CATALOG ---'
          curl --fail --silent --show-error --location --max-time 20 "$BASE/catalog.json?channel=play" -o catalog.json || true
          node <<'NODE'
          const fs=require('fs');
          try {
            const c=JSON.parse(fs.readFileSync('catalog.json','utf8'));
            console.log(JSON.stringify({studio:c.studio, ids:(c.series||[]).map(x=>x.id), hpg:(c.series||[]).find(x=>x.id==='hikayat-pohon-ganja')||null},null,2));
          } catch(e){console.log('CATALOG_PARSE_FAILED',String(e));}
          NODE
          echo '--- COVER /comics ---'
          curl --silent --show-error --location --max-time 20 -D comics-headers.txt -o comics-cover.bin -w 'HTTP=%{http_code} SIZE=%{size_download}\n' "$BASE/comics/hikayat-pohon-ganja/cover.jpg" || true
          cat comics-headers.txt || true
          echo '--- COVER /media ---'
          curl --silent --show-error --location --max-time 20 -D media-headers.txt -o media-cover.bin -w 'HTTP=%{http_code} SIZE=%{size_download}\n' "$BASE/media/comics/hikayat-pohon-ganja/cover.jpg" || true
          cat media-headers.txt || true
