name: AM STUDIO Android Hotfix v0.1.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-hotfix-v012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AM_STUDIO_ANDROID_KEYSTORE_B64: ${{ secrets.AM_STUDIO_ANDROID_KEYSTORE_B64 }}
      AM_STUDIO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AM_STUDIO_ANDROID_KEYSTORE_PASSWORD }}
      AM_STUDIO_ANDROID_KEY_ALIAS: ${{ secrets.AM_STUDIO_ANDROID_KEY_ALIAS }}
      AM_STUDIO_ANDROID_KEY_PASSWORD: ${{ secrets.AM_STUDIO_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate production signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in AM_STUDIO_ANDROID_KEYSTORE_B64 AM_STUDIO_ANDROID_KEYSTORE_PASSWORD AM_STUDIO_ANDROID_KEY_ALIAS AM_STUDIO_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for production signing"
              exit 1
            fi
          done

      - name: Restore production keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/am-studio-production.jks"
          printf '%s' "$AM_STUDIO_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "AM_STUDIO_ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed production APK
        working-directory: android
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed hotfix APK
        uses: actions/upload-artifact@v4
        with:
          name: AM-STUDIO-v0.1.2-MULTI-UPLOAD-HOTFIX
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
