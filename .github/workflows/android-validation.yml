name: AM STUDIO Android Validation

on:
  push:
    branches:
      - main
      - feature/am-studio-android-v1
    paths:
      - 'android/**'
      - '.github/workflows/android-validation.yml'
      - '.github/workflows/android-production-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-validation.yml'
      - '.github/workflows/android-production-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore validation signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: am-studio-android-debug-key-v1

      - name: Ensure validation signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=AM STUDIO Validation,O=Arda Core Corporation,C=ID" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Show actual Gradle signing source
        working-directory: android
        run: gradle --no-daemon :app:signingReport

      - name: Validate debug and release builds
        working-directory: android
        run: gradle --no-daemon clean assembleDebug assembleRelease

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          REPORT="android/app/build/outputs/apk/debug/AM-STUDIO-build-identity.txt"
          : > "$REPORT"
          echo "AM STUDIO Android build identity" | tee -a "$REPORT"
          echo "commit=$GITHUB_SHA" | tee -a "$REPORT"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1 | tee -a "$REPORT"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee -a "$REPORT"
          echo "Validation keystore fingerprint:" | tee -a "$REPORT"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256:|Owner:|Issuer:' | tee -a "$REPORT"

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: AM-STUDIO-Android-RC
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/AM-STUDIO-build-identity.txt
          if-no-files-found: error
          retention-days: 14
