name: AM STUDIO One-shot Publisher Episode 02 bc9d2d6b
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publisher-episode02-bc9d2d6b.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish Sun Gokong Episode 02
        shell: bash
        run: |
          set -euo pipefail
          URL="https://comics.nadmo.id/api/publisher/process/bc9d2d6b-b651-4e14-9b84-5b3dce2d8837"
          for attempt in 1 2 3 4; do
            RESP="$(curl --fail-with-body -sS -X POST "$URL" \
              -H 'Origin: https://comics.nadmo.id' \
              -H 'Accept: application/json' \
              -H 'x-am-comic-id: sg-battle' \
              -H 'x-am-channel-id: ch-sun-gokong-battle')"
            echo "$RESP"
            if echo "$RESP" | grep -q '"status":"PUBLISHED"'; then exit 0; fi
            sleep 2
          done
          echo "Publisher did not reach PUBLISHED" >&2
          exit 1
