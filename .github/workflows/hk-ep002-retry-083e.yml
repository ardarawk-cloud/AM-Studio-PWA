name: AM STUDIO Han Kera Episode 002 verified publisher retry
on:
  push:
    branches:
      - ops/hk-ep002-retry-083e
    paths:
      - .github/workflows/hk-ep002-retry-083e.yml
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Process previously approved immutable release
        shell: bash
        run: |
          set -euo pipefail
          url="https://comics.nadmo.id/api/publisher/process/083e66be-a8f7-40e2-a8ff-2c8782e8ee87"
          status_url="https://comics.nadmo.id/api/publisher/releases/083e66be-a8f7-40e2-a8ff-2c8782e8ee87"
          for attempt in 1 2 3 4 5; do
            response="$(curl -fsS --max-time 60 -X POST "$url" -H 'Origin: https://comics.nadmo.id' -H 'Accept: application/json' -H 'x-am-comic-id: hk' -H 'x-am-channel-id: ch-han-kera' || true)"
            echo "Publisher attempt ${attempt}: ${response:0:1500}"
            if [[ "$response" =~ \"status\"[[:space:]]*:[[:space:]]*\"PUBLISHED\" ]]; then
              receipt="$(curl -fsS --max-time 30 "$status_url")"
              echo "Final receipt: ${receipt:0:3000}"
              [[ "$receipt" =~ \"status\"[[:space:]]*:[[:space:]]*\"PUBLISHED\" ]] && exit 0
            fi
            sleep 5
          done
          exit 1
