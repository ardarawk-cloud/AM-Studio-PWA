name: AM STUDIO One-shot Cover Publisher 6a8e0d0a
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publisher-cover-6a8e0d0a.yml"
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process approved Sun Gokong cover
        shell: bash
        run: |
          set -euo pipefail
          URL="https://comics.nadmo.id/api/publisher/process/6a8e0d0a-d0e0-4ec5-9e1e-41de4d4ed622"
          for attempt in 1 2 3 4; do
            RESP="$(curl --fail-with-body -sS -X POST "$URL" \
              -H 'Origin: https://comics.nadmo.id' \
              -H 'Accept: application/json' \
              -H 'x-am-comic-id: sg-battle' \
              -H 'x-am-channel-id: ch-sun-gokong-battle')"
            echo "$RESP"
            if echo "$RESP" | grep -q '"status":"PUBLISHED"'; then exit 0; fi
            sleep 2
          done
          exit 1
