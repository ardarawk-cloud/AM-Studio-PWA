name: Brush Gallery Split Once
on:
  push:
    paths:
      - '.github/workflows/brush-gallery-split-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild atlas and split into BY_IMAGES files
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import base64

          root = Path('brush-by-yuda')
          encoded = ''.join(
              (root / f'gallery-atlas-q0{i}.txt').read_text(encoding='utf-8')
              for i in range(5)
          )
          encoded = ''.join(encoded.split())
          payload = base64.b64decode(encoded, validate=True)
          if not payload.startswith(b'\xff\xd8') or not payload.endswith(b'\xff\xd9'):
              raise SystemExit('Reconstructed atlas is not a complete JPEG stream')

          image = Image.open(BytesIO(payload)).convert('RGB')
          if image.size != (1440, 1920):
              raise SystemExit(f'Unexpected atlas size: {image.size}')

          cell_w, cell_h = 360, 480
          for source_index in range(14):
              col = source_index % 4
              row = source_index // 4
              crop = image.crop((col * cell_w, row * cell_h, (col + 1) * cell_w, (row + 1) * cell_h))

              spans = [high - low for low, high in crop.getextrema()]
              if max(spans) < 20:
                  raise SystemExit(f'Photo {source_index + 6} appears blank: channel spans {spans}')

              buffer = BytesIO()
              crop.save(buffer, format='WEBP', quality=94, method=6)
              webp = buffer.getvalue()

              verify = Image.open(BytesIO(webp))
              if verify.size != (cell_w, cell_h):
                  raise SystemExit(f'Invalid generated size for photo {source_index + 6}: {verify.size}')

              target_index = source_index + 6
              encoded_webp = base64.b64encode(webp).decode('ascii')
              (root / f'photo{target_index}.js').write_text(
                  f"window.BY_IMAGES[{target_index}]='data:image/webp;base64,{encoded_webp}';\n",
                  encoding='utf-8'
              )
              print(f'photo{target_index}.js: 360x480, spans={spans}, bytes={len(webp)}')

          print('Generated photo6.js through photo19.js from complete q00-q04 atlas.')
          PY
      - name: Commit generated gallery files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brush-by-yuda/photo6.js brush-by-yuda/photo7.js brush-by-yuda/photo8.js brush-by-yuda/photo9.js brush-by-yuda/photo10.js brush-by-yuda/photo11.js brush-by-yuda/photo12.js brush-by-yuda/photo13.js brush-by-yuda/photo14.js brush-by-yuda/photo15.js brush-by-yuda/photo16.js brush-by-yuda/photo17.js brush-by-yuda/photo18.js brush-by-yuda/photo19.js
          git diff --cached --quiet && exit 0
          git commit -m "Generate individual Brush portfolio images"
          git push
