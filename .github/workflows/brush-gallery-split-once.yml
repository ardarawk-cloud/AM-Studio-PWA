name: Brush Gallery Atlas Diagnostic
on:
  push:
    paths:
      - '.github/workflows/brush-gallery-split-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild atlas
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          from PIL import Image
          from io import BytesIO

          root=Path('brush-by-yuda')
          encoded=''.join((root/f'gallery-atlas-q0{i}.txt').read_text() for i in range(5))
          payload=base64.b64decode(''.join(encoded.split()), validate=True)
          (Path('diagnostic-atlas.jpg')).write_bytes(payload)
          im=Image.open(BytesIO(payload)).convert('RGB')
          print('atlas_size=',im.size)
          if im.size != (480,640):
              raise SystemExit(f'Unexpected atlas size {im.size}')
          for i in range(14):
              c=i%4; r=i//4
              tile=im.crop((c*120,r*160,(c+1)*120,(r+1)*160))
              # deterministic 8x8 grayscale difference hash for matching originals
              gray=tile.resize((9,8)).convert('L')
              px=list(gray.getdata())
              bits=[]
              for y in range(8):
                  row=px[y*9:(y+1)*9]
                  bits.extend(1 if row[x] > row[x+1] else 0 for x in range(8))
              value=0
              for b in bits:
                  value=(value<<1)|b
              print(f'tile{i:02d}_dhash={value:016x}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: brush-gallery-diagnostic-atlas
          path: diagnostic-atlas.jpg
          retention-days: 1
