name: AM STUDIO Play Reader Policy

on:
  push:
    branches:
      - main
      - fix/amstudio-play-device-apk
    paths:
      - 'public/native-reader.js'
      - 'public/play-release.json'
      - 'public/reader-assets.json'
      - 'public/index.html'
      - 'src/play-firewall-runtime.js'
      - 'wrangler.jsonc'
      - 'tests/division-play-reader.test.mjs'
      - 'tests/division-play-firewall.test.mjs'
      - '.github/workflows/play-reader-policy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'public/native-reader.js'
      - 'public/play-release.json'
      - 'public/reader-assets.json'
      - 'public/index.html'
      - 'src/play-firewall-runtime.js'
      - 'wrangler.jsonc'
      - 'tests/division-play-reader.test.mjs'
      - 'tests/division-play-firewall.test.mjs'
      - '.github/workflows/play-reader-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate Play Reader and firewall syntax
        run: |
          node --check public/native-reader.js
          node --check src/play-firewall-runtime.js

      - name: Run Play Reader release policy tests
        run: node --test tests/division-play-reader.test.mjs tests/division-play-firewall.test.mjs
