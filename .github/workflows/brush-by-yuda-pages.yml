name: Deploy Brush by Yuda Christ

on:
  push:
    branches: [main]
    paths:
      - 'brush-by-yuda/**'
      - '.github/workflows/brush-by-yuda-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

actions:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Brush by Yuda site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./brush-by-yuda

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
