name: AM STUDIO Independent Public APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Public APK versionName'
        required: true
        default: '1.0.0'
        type: string
      version_code:
        description: 'Public APK versionCode'
        required: true
        default: '10000'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AM_STUDIO_APPLICATION_ID: com.ardacore.amstudio
      AM_STUDIO_PUBLIC_MODE: 'true'
      AM_STUDIO_PLAY_MODE: 'false'
      AM_STUDIO_VERSION_NAME: ${{ inputs.version_name }}
      AM_STUDIO_VERSION_CODE: ${{ inputs.version_code }}
      AM_STUDIO_ANDROID_KEYSTORE_B64: ${{ secrets.AM_STUDIO_ANDROID_KEYSTORE_B64 }}
      AM_STUDIO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AM_STUDIO_ANDROID_KEYSTORE_PASSWORD }}
      AM_STUDIO_ANDROID_KEY_ALIAS: ${{ secrets.AM_STUDIO_ANDROID_KEY_ALIAS }}
      AM_STUDIO_ANDROID_KEY_PASSWORD: ${{ secrets.AM_STUDIO_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Require protected signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in AM_STUDIO_ANDROID_KEYSTORE_B64 AM_STUDIO_ANDROID_KEYSTORE_PASSWORD AM_STUDIO_ANDROID_KEY_ALIAS AM_STUDIO_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required"
              exit 1
            fi
          done

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/am-studio-public-release.jks"
          printf '%s' "$AM_STUDIO_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$AM_STUDIO_ANDROID_KEYSTORE_PASSWORD" -alias "$AM_STUDIO_ANDROID_KEY_ALIAS" >/dev/null
          echo "AM_STUDIO_ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed public APK
        working-directory: android
        run: gradle --no-daemon clean assembleRelease lintRelease

      - name: Verify public APK security surface
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.ardacore.amstudio'"
          echo "$BADGING" | grep -q "versionCode='${AM_STUDIO_VERSION_CODE}'"
          echo "$BADGING" | grep -q "versionName='${AM_STUDIO_VERSION_NAME}'"

          CONFIG='android/app/build/generated/source/buildConfig/release/com/ardacore/amstudio/BuildConfig.java'
          test -f "$CONFIG"
          grep -q 'PUBLIC_READER_MODE = true' "$CONFIG"
          grep -q 'PLAY_STORE_MODE = false' "$CONFIG"

          PERMS=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK")
          printf '%s\n' "$PERMS"
          printf '%s\n' "$PERMS" | grep -q 'android.permission.INTERNET'
          ! printf '%s\n' "$PERMS" | grep -Eq 'ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|WRITE_CONTACTS|RECORD_AUDIO|CAMERA|READ_SMS|SEND_SMS|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW|QUERY_ALL_PACKAGES'

      - name: Package stable public artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-out
          cp android/app/build/outputs/apk/release/app-release.apk public-out/AM-STUDIO.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs public-out/AM-STUDIO.apk > public-out/signing-certificate.txt
          sha256sum public-out/AM-STUDIO.apk > public-out/SHA256SUMS.txt
          {
            echo "AM STUDIO Independent Public APK"
            echo "versionName=${AM_STUDIO_VERSION_NAME}"
            echo "versionCode=${AM_STUDIO_VERSION_CODE}"
            echo "applicationId=com.ardacore.amstudio"
            echo "channel=INDEPENDENT_PUBLIC"
            echo "adminTools=BLOCKED"
            echo "googlePlayBilling=NONE"
            echo "commit=${GITHUB_SHA}"
          } > public-out/RELEASE.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="am-studio-public-v${AM_STUDIO_VERSION_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" public-out/AM-STUDIO.apk public-out/SHA256SUMS.txt public-out/signing-certificate.txt public-out/RELEASE.txt \
            --title "AM STUDIO v${AM_STUDIO_VERSION_NAME}" \
            --notes "Official independent AM STUDIO Android release." \
            --latest

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AM-STUDIO-Independent-v${{ inputs.version_name }}-${{ inputs.version_code }}
          path: public-out/
          if-no-files-found: error
          retention-days: 30

      - name: Remove release key
        if: always()
        shell: bash
        run: rm -f "${AM_STUDIO_ANDROID_KEYSTORE_PATH:-$RUNNER_TEMP/am-studio-public-release.jks}"
