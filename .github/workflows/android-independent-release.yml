name: AM STUDIO Independent Public APK

on:
  push:
    branches:
      - main
    paths:
      - 'public/independent-release.json'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Public APK versionName'
        required: true
        default: '1.0.0'
        type: string
      version_code:
        description: 'Public APK versionCode'
        required: true
        default: '10000'
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AM_STUDIO_APPLICATION_ID: com.ardacore.amstudio
      AM_STUDIO_PUBLIC_MODE: 'true'
      AM_STUDIO_PLAY_MODE: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve public release version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
          else
            VERSION_NAME="$(node -p "require('./public/independent-release.json').versionName")"
            VERSION_CODE="$(node -p "require('./public/independent-release.json').versionCode")"
          fi
          case "$VERSION_CODE" in ''|*[!0-9]*) echo "::error::Invalid versionCode"; exit 1 ;; esac
          test -n "$VERSION_NAME"
          echo "AM_STUDIO_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "AM_STUDIO_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Fetch protected release signing material
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=am-studio-signing")"
          OIDC_TOKEN="$(printf '%s' "$TOKEN_JSON" | jq -r '.value')"
          test -n "$OIDC_TOKEN"
          test "$OIDC_TOKEN" != "null"

          MATERIAL="$RUNNER_TEMP/am-studio-signing.json"
          STATUS=""
          for attempt in $(seq 1 12); do
            STATUS="$(curl -sS -o "$MATERIAL" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H 'Accept: application/json' \
              'https://am-studio-pwa.ardarawk.workers.dev/api/internal/build/signing-material' || true)"
            [ "$STATUS" = "200" ] && break
            sleep 5
          done
          if [ "$STATUS" != "200" ]; then
            echo "::error::Unable to retrieve protected signing material (HTTP $STATUS)"
            cat "$MATERIAL" || true
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/am-studio-public-release.jks"
          STORE_PASSWORD="$(jq -r '.storePassword' "$MATERIAL")"
          KEY_ALIAS="$(jq -r '.alias' "$MATERIAL")"
          KEY_PASSWORD="$(jq -r '.keyPassword' "$MATERIAL")"
          jq -r '.keystoreB64' "$MATERIAL" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "AM_STUDIO_ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "AM_STUDIO_ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AM_STUDIO_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AM_STUDIO_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          rm -f "$MATERIAL"

      - name: Build signed public APK
        working-directory: android
        run: gradle --no-daemon clean assembleRelease lintRelease

      - name: Verify public APK security surface
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.ardacore.amstudio'"
          echo "$BADGING" | grep -q "versionCode='${AM_STUDIO_VERSION_CODE}'"
          echo "$BADGING" | grep -q "versionName='${AM_STUDIO_VERSION_NAME}'"

          CONFIG='android/app/build/generated/source/buildConfig/release/com/ardacore/amstudio/BuildConfig.java'
          test -f "$CONFIG"
          grep -q 'PUBLIC_READER_MODE = true' "$CONFIG"
          grep -q 'PLAY_STORE_MODE = false' "$CONFIG"

          PERMS=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK")
          printf '%s\n' "$PERMS"
          printf '%s\n' "$PERMS" | grep -q 'android.permission.INTERNET'
          ! printf '%s\n' "$PERMS" | grep -Eq 'ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|WRITE_CONTACTS|RECORD_AUDIO|CAMERA|READ_SMS|SEND_SMS|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW|QUERY_ALL_PACKAGES'

      - name: Package stable public artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-out
          cp android/app/build/outputs/apk/release/app-release.apk public-out/AM-STUDIO.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs public-out/AM-STUDIO.apk > public-out/signing-certificate.txt
          sha256sum public-out/AM-STUDIO.apk > public-out/SHA256SUMS.txt
          {
            echo "AM STUDIO Independent Public APK"
            echo "versionName=${AM_STUDIO_VERSION_NAME}"
            echo "versionCode=${AM_STUDIO_VERSION_CODE}"
            echo "applicationId=com.ardacore.amstudio"
            echo "channel=INDEPENDENT_PUBLIC"
            echo "adminTools=BLOCKED"
            echo "googlePlayBilling=NONE"
            echo "commit=${GITHUB_SHA}"
          } > public-out/RELEASE.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="am-studio-public-v${AM_STUDIO_VERSION_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" public-out/AM-STUDIO.apk public-out/SHA256SUMS.txt public-out/signing-certificate.txt public-out/RELEASE.txt \
            --title "AM STUDIO v${AM_STUDIO_VERSION_NAME}" \
            --notes "Official independent AM STUDIO Android release." \
            --latest

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AM-STUDIO-Independent-v${{ inputs.version_name }}-${{ inputs.version_code }}
          path: public-out/
          if-no-files-found: error
          retention-days: 30

      - name: Remove release key
        if: always()
        shell: bash
        run: rm -f "${AM_STUDIO_ANDROID_KEYSTORE_PATH:-$RUNNER_TEMP/am-studio-public-release.jks}"
