name: AM STUDIO Pipeline Validation

on:
  push:
    branches: [feature/auto-episode-pipeline-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx wrangler deploy --dry-run
