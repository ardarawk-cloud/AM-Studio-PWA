apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv('AM_STUDIO_ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('AM_STUDIO_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('AM_STUDIO_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('AM_STUDIO_ANDROID_KEY_PASSWORD')
def releaseSigningReady = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { value -> value != null && !value.trim().isEmpty() }
def stableDebugKeystore = file(System.getProperty('user.home') + '/.android/debug.keystore')

def amApplicationId = System.getenv('AM_STUDIO_APPLICATION_ID') ?: 'com.ardacore.amstudio.v2'
def amVersionName = System.getenv('AM_STUDIO_VERSION_NAME') ?: '0.2.3'
def amVersionCodeRaw = System.getenv('AM_STUDIO_VERSION_CODE')
def amVersionCode = amVersionCodeRaw ? Integer.parseInt(amVersionCodeRaw) : 4
def amPlayStoreMode = (System.getenv('AM_STUDIO_PLAY_MODE') ?: 'false').toBoolean()

android {
    namespace 'com.ardacore.amstudio'
    compileSdk 36

    defaultConfig {
        applicationId amApplicationId
        minSdk 26
        targetSdk 36
        versionCode amVersionCode
        versionName amVersionName
        buildConfigField 'boolean', 'PLAY_STORE_MODE', amPlayStoreMode.toString()
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        stableDebug {
            storeFile stableDebugKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.stableDebug
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
